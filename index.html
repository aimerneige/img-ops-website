<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3edf7" />
    <meta name="description" content="Tessera — private, in-browser photo collage, long-image stitching and grid splitting. No uploads, no watermark." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Tessera</title>
    <script>
      // Avoid a light flash before the theme module runs.
      try {
        var m = JSON.parse(localStorage.getItem('tessera:theme.mode') || '"system"');
        var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.style.background = d ? '#141218' : '#fef7ff';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
